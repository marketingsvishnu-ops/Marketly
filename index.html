<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us on WhatsApp</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
      padding: 40px 20px;
    }
    .box {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #25D366;
      color: #fff;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    .note {
      font-size: 13px;
      color: #666;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Need Help?</h1>
    <p>
      Thank you for your interest.  
      You can contact us on WhatsApp for product details, pricing, availability, and support.
    </p>

    <a class="btn" href="https://wa.me/+447546795559?text=Hello%2C%20I%20am%20interested%20in%20your%20service.%20Please%20share%20more%20details.">
      Message Us on WhatsApp
    </a>

    <p class="note">
      We usually respond during business hours. By contacting us, you agree to receive replies related to your enquiry.
    </p>
  </div>

</body>
</html>
